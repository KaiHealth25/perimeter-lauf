# Hoerproben fuer "Briefing hoeren" (Runde 101). Nur von Hand. Rechnet die
# freien Stimmen hier statt auf dem Mac; das Ergebnis ist verschlossen wie
# Zustand und Protokoll. Beruehrt den Daten- und den Lagelauf nicht.
name: Hoerprobe

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Stand des Codes, sonst main
        required: false
        default: main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        modell: [piper, chatterbox]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: KaiHealth25/perimeter
          ref: ${{ inputs.ref || 'main' }}
          ssh-key: ${{ secrets.CODE_KEY }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Piper
        if: matrix.modell == 'piper'
        run: pip install -q piper-tts numpy cryptography

      - name: Chatterbox
        if: matrix.modell == 'chatterbox'
        run: |
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts cryptography

      - name: Probe
        env:
          DATEN_SCHLUESSEL: ${{ secrets.DATEN_SCHLUESSEL }}
        run: python3 tools/hoerprobe.py ${{ matrix.modell }}

      - name: Verschliessen
        if: always()
        env:
          ZUSTAND_SCHLUESSEL: ${{ secrets.ZUSTAND_SCHLUESSEL }}
        run: '[ -d hoerprobe ] && rm -rf hoerprobe/modelle && python3 tools/kiste.py zu hoerprobe hoerprobe.bin || true'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hoerprobe-${{ matrix.modell }}
          path: hoerprobe.bin
          retention-days: 3
          if-no-files-found: ignore

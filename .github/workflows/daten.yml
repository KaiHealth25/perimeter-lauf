# Huelle fuer den Datenlauf von Perimeter. Die Arbeit steht im privaten Code
# (lauf/daten.sh), dieser Ablauf holt ihn nur und ruft ihn auf. Er liegt in
# diesem oeffentlichen Repo, weil GitHub hier keine Minuten zaehlt.
# Zustand und Protokoll sind verschlossen.
name: Daten

on:
  schedule:
    # Zweite Uhr neben dem Wecker. Angestossen wird stuendlich zur fuenften
    # Minute von aussen, GitHubs Zeitplan ist unzuverlaessig, kostet hier aber
    # nichts. Laeuft er zusaetzlich, schadet das nicht: nichts wird doppelt
    # ausgewertet, und zwei Laeufe warten aufeinander.
    - cron: "35 * * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Stand des Codes, sonst main
        required: false
        default: main

permissions:
  contents: write
  issues: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  lauf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: KaiHealth25/perimeter
          ref: ${{ inputs.ref || 'main' }}
          ssh-key: ${{ secrets.CODE_KEY }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Ortsliste
        uses: actions/cache@v4
        with:
          path: .cache/ne_10m_populated_places_simple.geojson
          key: natural-earth-orte-v1

      - name: Lauf
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATEN_SCHLUESSEL: ${{ secrets.DATEN_SCHLUESSEL }}
          DATEN_DEPLOY_KEY: ${{ secrets.DATEN_DEPLOY_KEY }}
          ZUSTAND_SCHLUESSEL: ${{ secrets.ZUSTAND_SCHLUESSEL }}
          GH_TOKEN: ${{ github.token }}
          LAUF_REPO: ${{ github.repository }}
          LAUF_ID: ${{ github.run_id }}
          LAUF_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EREIGNIS: ${{ github.event_name }}
        run: bash lauf/daten.sh

      - name: Protokoll
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protokoll
          path: protokoll.bin
          retention-days: 14
          if-no-files-found: ignore
